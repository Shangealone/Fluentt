name: fluentt-development
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluentt
      POSTGRES_USER: fluentt_dev
      POSTGRES_PASSWORD: ${FLUENTT_POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fluentt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentt_dev -d fluentt"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fluentt_postgres_data:
