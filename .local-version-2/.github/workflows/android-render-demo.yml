name: Android Render demo APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/wavlm-codespaces-demo
    paths:
      - .github/workflows/android-render-demo.yml
      - apps/mobile/app.json
      - apps/mobile/eas.json

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_ANDROID_API_URL: https://fluentt-synthetic-staging.onrender.com
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: fluentt-render-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
