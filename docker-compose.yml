services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluentt
      POSTGRES_USER: fluentt
      POSTGRES_PASSWORD: fluentt_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentt -d fluentt"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fluentt_pgdata:/var/lib/postgresql/data

volumes:
  fluentt_pgdata:
